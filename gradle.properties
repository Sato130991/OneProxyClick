org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# On Linux ARM64 (aarch64) the aapt2 binary that AGP downloads from Maven is x86_64-only.
# Set a native ARM64 aapt2 (version >= 2.20, able to read android-35's android.jar) per machine in
# ~/.gradle/gradle.properties:   android.aapt2FromMavenOverride=/path/to/aapt2
# or on the command line:        ./gradlew assembleDebug -Pandroid.aapt2FromMavenOverride=/path/to/aapt2
# Note: Debian/Ubuntu's 'aapt' package (2.19-debian) is too old for compileSdk 35.
